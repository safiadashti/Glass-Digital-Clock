<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glass Morphism Clock</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="background">
        <div class="circle circle-one"></div>
        <div class="circle circle-two"></div>
        <div class="circle circle-three"></div>
    </div>

    <main class="clock-container">

<h1> Digital Clock</h1>
<p class="subtitle">Premium Digital Experience</p>        <!-- Analog Clock -->
        <div class="analog-clock">

            <div class="number n12">12</div>
            <div class="number n3">3</div>
            <div class="number n6">6</div>
            <div class="number n9">9</div>

            <div class="hand hour" id="hourHand"></div>
            <div class="hand minute" id="minuteHand"></div>
            <div class="hand second" id="secondHand"></div>

            <div class="center-dot"></div>

        </div>



        <!-- Digital Clock -->
        <div class="digital-clock">
            <span id="hours">00</span>
            <span class="colon">:</span>
            <span id="minutes">00</span>
            <span class="colon">:</span>
            <span id="seconds">00</span>
            <span id="ampm">AM</span>
        </div>

        <div class="date" id="date"></div>

        <!-- Toggle Button -->
        <button id="formatBtn">Switch to 24H</button>
      
        <p class="footer">Designed with  ❤️ using HTML, CSS & JS</p>

    </main>

    <script src="script.js"></script>
</body>
</html>
